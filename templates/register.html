<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注册 — 第四次世界大战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:#0d0d1a;
  display:flex;align-items:center;justify-content:center;
  font-family:'Microsoft YaHei',system-ui,sans-serif;
  position:relative;overflow:hidden;
  padding:20px 0;
}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;}
.bg::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 80% 50%,rgba(233,69,96,.12) 0%,transparent 70%),
             radial-gradient(ellipse 60% 80% at 20% 30%,rgba(15,52,96,.4) 0%,transparent 70%);
}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s infinite;}
@keyframes twinkle{0%,100%{opacity:.1;}50%{opacity:.5;}}
.card{
  position:relative;z-index:1;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:24px;
  padding:48px;width:440px;
  box-shadow:0 32px 64px rgba(0,0,0,.6);
}
.logo{text-align:center;margin-bottom:32px;}
.logo-icon{font-size:36px;display:block;margin-bottom:10px;filter:drop-shadow(0 0 16px rgba(233,69,96,.6));}
.logo h1{
  font-size:22px;font-weight:800;
  background:linear-gradient(135deg,#ff6b6b,#e94560,#c23152);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:3px;
}
.logo p{color:rgba(255,255,255,.28);font-size:11px;margin-top:6px;letter-spacing:4px;}
.field{margin-bottom:16px;}
.field label{display:block;color:rgba(255,255,255,.45);font-size:12px;margin-bottom:7px;letter-spacing:1px;}
.field input{
  width:100%;padding:12px 16px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;color:#fff;font-size:15px;outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.field input:focus{background:rgba(255,255,255,.09);border-color:rgba(233,69,96,.7);box-shadow:0 0 0 3px rgba(233,69,96,.12);}
.field input::placeholder{color:rgba(255,255,255,.2);}
.field input.err-input{border-color:rgba(233,69,96,.6);}

.sec-box{
  background:rgba(233,69,96,.06);
  border:1px solid rgba(233,69,96,.2);
  border-radius:14px;padding:16px;margin-bottom:16px;
}
.sec-box .q-label{
  font-size:13px;font-weight:600;color:#ff8fa0;margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.sec-box input{
  width:100%;padding:11px 14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;color:#fff;font-size:14px;outline:none;
  transition:border-color .2s;
}
.sec-box input:focus{border-color:rgba(233,69,96,.6);}
.sec-box input::placeholder{color:rgba(255,255,255,.2);}

.btn-main{
  width:100%;padding:14px;margin-top:4px;
  background:linear-gradient(135deg,#e94560 0%,#c23152 100%);
  border:none;border-radius:12px;color:#fff;
  font-size:16px;font-weight:700;cursor:pointer;letter-spacing:2px;
  transition:opacity .2s,transform .1s,box-shadow .2s;
  box-shadow:0 4px 20px rgba(233,69,96,.4);
}
.btn-main:hover{opacity:.92;}
.btn-main:active{transform:scale(.98);}
.btn-main:disabled{opacity:.5;cursor:not-allowed;}
.alt{text-align:center;margin-top:20px;color:rgba(255,255,255,.3);font-size:14px;}
.alt a{color:#e94560;text-decoration:none;font-weight:600;}
.msg-box{border-radius:10px;padding:11px 14px;margin-bottom:16px;font-size:14px;text-align:center;display:none;}
.msg-box.err{background:rgba(233,69,96,.12);border:1px solid rgba(233,69,96,.25);color:#ff7a91;display:block;}
.msg-box.ok{background:rgba(80,200,120,.1);border:1px solid rgba(80,200,120,.25);color:#6ee7a0;display:block;}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="card">
  <div class="logo">
    <span class="logo-icon">⚔️</span>
    <h1>第四次世界大战</h1>
    <p>注册成为战场一员</p>
  </div>
  <div class="msg-box" id="msg"></div>
  <div class="field">
    <label>用户名（2-16个字符）</label>
    <input type="text" id="username" placeholder="设置你的战场代号" autocomplete="username">
  </div>
  <div class="field">
    <label>密码（至少6位）</label>
    <input type="password" id="password" placeholder="设置密码" autocomplete="new-password">
  </div>
  <div class="field">
    <label>确认密码</label>
    <input type="password" id="password2" placeholder="再次输入密码">
  </div>
  <div class="sec-box">
    <div class="q-label">🔐 <span id="sec-q">安全验证加载中…</span></div>
    <input type="text" id="answer" placeholder="输入答案">
  </div>
  <button class="btn-main" id="reg-btn" onclick="doRegister()">加入战场</button>
  <div class="alt">已有账号？<a href="/login">直接登录</a></div>
</div>
<script>
const bg=document.getElementById('bg');
for(let i=0;i<60;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2+1;
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
  bg.appendChild(s);
}

(async()=>{
  try{
    const r=await fetch('/api/security_question');
    const d=await r.json();
    document.getElementById('sec-q').textContent=d.question||'安全问题';
  }catch(e){document.getElementById('sec-q').textContent='安全验证';}
})();

const msgEl=document.getElementById('msg');
function showMsg(text,type){msgEl.className='msg-box '+type;msgEl.textContent=text;}

async function doRegister(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const password2=document.getElementById('password2').value;
  const answer=document.getElementById('answer').value.trim();
  if(!username||!password||!password2||!answer){showMsg('请填写所有字段','err');return;}
  if(username.length<2||username.length>16){showMsg('用户名需2-16个字符','err');return;}
  if(password.length<6){showMsg('密码至少6个字符','err');return;}
  if(password!==password2){showMsg('两次密码不一致','err');return;}
  const btn=document.getElementById('reg-btn');
  btn.textContent='注册中…';btn.disabled=true;
  try{
    const res=await fetch('/api/register',{
      method:'POST',headers:{'Content-Type':'application/json'},
      credentials:'include',
      body:JSON.stringify({username,password,answer})
    });
    const data=await res.json();
    if(data.ok){
      showMsg('注册成功！即将跳转到登录页…','ok');
      setTimeout(()=>location.href='/login',1200);
    }else{
      showMsg(data.msg||'注册失败','err');
      btn.textContent='加入战场';btn.disabled=false;
    }
  }catch(e){
    showMsg('网络错误，请重试','err');
    btn.textContent='加入战场';btn.disabled=false;
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!document.getElementById('reg-btn').disabled)doRegister();});
</script>
</body>
</html>
