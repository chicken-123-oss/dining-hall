<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>话题 — 第四次世界大战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0d1a;color:#e0e0e0;font-family:'Microsoft YaHei',system-ui,sans-serif;min-height:100vh;padding-bottom:130px;}

/* ── NAV ── */
.nav{
  background:rgba(8,8,20,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(233,69,96,.25);
  padding:0 40px;height:62px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.nav-logo{
  font-size:18px;font-weight:800;cursor:pointer;
  background:linear-gradient(135deg,#ff6b6b,#e94560);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:2px;
}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-user{
  font-size:13px;padding:5px 12px;
  background:rgba(255,255,255,.04);
  border-radius:16px;border:1px solid rgba(255,255,255,.07);
}
.nav-user a{color:#e94560;text-decoration:none;font-weight:600;}
.nav-btn{
  padding:6px 16px;border-radius:16px;font-size:13px;cursor:pointer;border:none;
  font-family:inherit;transition:all .2s;
}
.btn-outline{background:transparent;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);}
.btn-outline:hover{color:#fff;}
.btn-solid{background:#e94560;color:#fff;}
.btn-solid:hover{background:#c23152;}

/* ── CONTAINER ── */
.container{max-width:820px;margin:0 auto;padding:24px 20px;}

.back-link{
  display:inline-flex;align-items:center;gap:6px;
  color:rgba(255,255,255,.35);font-size:14px;cursor:pointer;
  margin-bottom:20px;transition:color .15s;
}
.back-link:hover{color:#e94560;}

/* ── TOPIC HEADER ── */
.topic-header{
  background:linear-gradient(135deg,rgba(233,69,96,.08),rgba(233,69,96,.02));
  border:1px solid rgba(233,69,96,.18);
  border-radius:18px;padding:28px 30px;margin-bottom:16px;
}
.topic-header h1{font-size:22px;font-weight:700;color:#fff;line-height:1.5;}
.topic-header .desc{color:rgba(255,255,255,.55);font-size:15px;margin-top:10px;line-height:1.65;}
.topic-header .meta{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  color:rgba(255,255,255,.28);font-size:13px;margin-top:14px;
}
.topic-header .meta a{color:rgba(255,255,255,.45);text-decoration:none;}
.topic-header .meta a:hover{color:#e94560;}

/* ── POSTS TOOLBAR ── */
.posts-toolbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;padding:0 4px;
}
.posts-count{font-size:13px;color:rgba(255,255,255,.3);}
.posts-count strong{color:#e94560;}
.toolbar-jumps{display:flex;gap:6px;}
.jump-btn{
  padding:4px 12px;border-radius:8px;border:none;
  background:rgba(255,255,255,.05);color:rgba(255,255,255,.4);
  font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;
}
.jump-btn:hover{background:rgba(233,69,96,.12);color:#e94560;}

/* ── SKELETON ── */
.skeleton{
  background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;
  border-radius:14px;height:100px;margin-bottom:8px;
}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ── POST CARD ── */
.post{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;padding:18px 20px;margin-bottom:8px;
  position:relative;transition:background .15s,border-color .15s;
}
.post:hover{background:rgba(255,255,255,.05);}
.post.highlight{
  border-color:rgba(233,69,96,.5);
  background:rgba(233,69,96,.06);
  animation:highlightPulse .8s ease;
}
@keyframes highlightPulse{
  0%,100%{box-shadow:none;}
  50%{box-shadow:0 0 0 3px rgba(233,69,96,.25);}
}

.post-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#fff;
}
.post-info .author{font-size:14px;font-weight:600;}
.post-info .author a{text-decoration:none;color:inherit;}
.post-info .author a:hover{text-decoration:underline;}
.post-info .time{font-size:12px;color:rgba(255,255,255,.25);margin-top:2px;}

.floor{
  position:absolute;right:16px;top:14px;
  font-size:11px;color:rgba(255,255,255,.18);
  background:rgba(255,255,255,.05);border-radius:4px;
  padding:2px 7px;
}

/* 悬浮操作按钮组 */
.post-actions{
  position:absolute;right:52px;top:12px;
  display:flex;gap:4px;opacity:0;transition:opacity .15s;
}
.post:hover .post-actions{opacity:1;}
.pa-btn{
  padding:3px 10px;border-radius:6px;font-size:12px;cursor:pointer;
  border:none;font-family:inherit;transition:all .15s;
}
.pa-reply{background:rgba(255,255,255,.07);color:rgba(255,255,255,.5);}
.pa-reply:hover{background:rgba(233,69,96,.12);color:#e94560;}
.pa-del{background:rgba(233,69,96,.08);color:rgba(233,69,96,.5);}
.pa-del:hover{background:rgba(233,69,96,.15);color:#ff7a91;}

.post-content{
  font-size:15px;line-height:1.75;color:#ccc;
  word-break:break-word;white-space:pre-wrap;
  user-select:text;
}

/* 引用块 */
.reply-ref{
  background:rgba(255,255,255,.05);
  border-left:3px solid rgba(233,69,96,.5);
  border-radius:0 8px 8px 0;
  padding:8px 14px;margin-bottom:12px;
  font-size:13px;color:rgba(255,255,255,.45);
  cursor:pointer;transition:background .15s;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.reply-ref:hover{background:rgba(233,69,96,.08);color:rgba(255,255,255,.7);}
.reply-ref .ra{color:#e94560;font-weight:600;margin-right:4px;}

/* ── 右键菜单 ── */
.ctx-menu{
  position:fixed;background:#1a1a32;
  border:1px solid rgba(233,69,96,.25);
  border-radius:12px;padding:6px;
  min-width:152px;z-index:500;
  box-shadow:0 12px 40px rgba(0,0,0,.6);
  display:none;animation:ctxIn .12s ease;
}
.ctx-menu.show{display:block;}
@keyframes ctxIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:none;}}
.ctx-item{
  padding:9px 16px;font-size:14px;color:rgba(255,255,255,.65);
  cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:8px;
  transition:background .1s;
}
.ctx-item:hover{background:rgba(233,69,96,.1);color:#fff;}
.ctx-del{color:rgba(233,69,96,.7);}
.ctx-del:hover{background:rgba(233,69,96,.12);color:#e94560;}

/* ── COMPOSE ── */
.compose{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(8,8,20,.97);
  border-top:1px solid rgba(255,255,255,.08);
  padding:10px 20px 14px;z-index:200;
  backdrop-filter:blur(20px);
}
.compose-inner{max-width:820px;margin:0 auto;}

.reply-indicator{
  background:rgba(233,69,96,.08);
  border:1px solid rgba(233,69,96,.18);
  border-radius:8px;padding:7px 12px;margin-bottom:8px;
  font-size:13px;color:rgba(255,255,255,.5);
  display:none;align-items:center;gap:8px;
}
.reply-indicator.show{display:flex;}
.ri-text{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.ri-text .ra{color:#e94560;font-weight:600;}
.ri-cancel{cursor:pointer;color:rgba(255,255,255,.3);flex-shrink:0;font-size:16px;line-height:1;}
.ri-cancel:hover{color:#e94560;}

.compose-row{display:flex;gap:10px;align-items:flex-end;}
.compose-row textarea{
  flex:1;padding:11px 15px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;color:#fff;font-size:15px;
  outline:none;resize:none;
  min-height:44px;max-height:180px;
  font-family:inherit;line-height:1.55;
  transition:border-color .2s;overflow-y:auto;
}
.compose-row textarea:focus{border-color:rgba(233,69,96,.5);}
.compose-row textarea::placeholder{color:rgba(255,255,255,.2);}
.send-btn{
  padding:0 22px;height:44px;
  background:#e94560;color:#fff;border:none;
  border-radius:12px;font-size:15px;font-weight:700;
  cursor:pointer;white-space:nowrap;transition:all .2s;
  font-family:inherit;flex-shrink:0;
}
.send-btn:hover{background:#c23152;}
.send-btn:active{transform:scale(.97);}
.send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.compose-footer{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:5px;
}
.compose-hint{font-size:12px;color:rgba(255,255,255,.18);}
.char-counter{font-size:12px;color:rgba(255,255,255,.25);transition:color .2s;}
.char-counter.warn{color:#ffaa44;}
.char-counter.over{color:#ff7a91;}

/* ── LOGIN GATE ── */
.login-gate{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(8,8,20,.97);border-top:1px solid rgba(255,255,255,.07);
  padding:18px;text-align:center;z-index:200;
  backdrop-filter:blur(16px);
}
.login-gate p{color:rgba(255,255,255,.4);font-size:14px;}
.login-gate a{color:#e94560;font-weight:600;text-decoration:none;}

/* ── EMPTY / ERROR ── */
.empty{text-align:center;padding:60px 20px;}
.empty .ei{font-size:48px;display:block;margin-bottom:14px;opacity:.4;}
.empty p{color:rgba(255,255,255,.25);font-size:15px;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  padding:10px 22px;border-radius:12px;font-size:14px;
  z-index:800;white-space:nowrap;display:none;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  animation:toastIn .2s ease;
}
.toast.show{display:block;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.toast.ok{background:rgba(20,40,28,.97);border:1px solid rgba(80,200,100,.35);color:#66dd88;}
.toast.err{background:rgba(40,10,14,.97);border:1px solid rgba(233,69,96,.35);color:#ff7a91;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo" onclick="location.href='/'">⚔️ 第四次世界大战</div>
  <div class="nav-right">
    <div class="nav-user" id="nav-user" style="display:none"></div>
    <button class="nav-btn btn-outline" id="btn-logout" style="display:none" onclick="doLogout()">退出</button>
    <button class="nav-btn btn-solid" id="btn-login" onclick="location.href='/login'">登录</button>
  </div>
</nav>

<div class="container">
  <div class="back-link" onclick="location.href='/'">← 返回首页</div>
  <div id="topic-header" class="topic-header">
    <div style="color:rgba(255,255,255,.3)">加载中…</div>
  </div>

  <!-- 发言工具栏 -->
  <div class="posts-toolbar" id="posts-toolbar" style="display:none">
    <div class="posts-count">共 <strong id="posts-total">0</strong> 条发言</div>
    <div class="toolbar-jumps">
      <button class="jump-btn" onclick="jumpToFloor(1)">↑ 首楼</button>
      <button class="jump-btn" onclick="jumpToLast()">↓ 末楼</button>
    </div>
  </div>

  <!-- 骨架屏 -->
  <div id="skeleton-wrap">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <div id="posts-wrap"></div>
</div>

<!-- 右键菜单 -->
<div class="ctx-menu" id="ctx-menu">
  <div class="ctx-item" id="ctx-reply" onclick="ctxReply()">↩ 回复这条发言</div>
  <div class="ctx-item ctx-del" id="ctx-del" onclick="ctxDelete()" style="display:none">🗑 删除</div>
</div>

<!-- 底部发言框（已登录） -->
<div class="compose" id="compose" style="display:none">
  <div class="compose-inner">
    <div class="reply-indicator" id="reply-indicator">
      <div class="ri-text" id="ri-text"></div>
      <span class="ri-cancel" onclick="cancelReply()" title="取消回复">✕</span>
    </div>
    <div class="compose-row">
      <textarea id="compose-text"
        placeholder="发表你的观点…"
        maxlength="2000"
        oninput="onTextInput(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendPost()">发送</button>
    </div>
    <div class="compose-footer">
      <span class="compose-hint">右键发言可定向回复 · Ctrl+Enter 发送</span>
      <span class="char-counter" id="char-counter">0 / 2000</span>
    </div>
  </div>
</div>

<!-- 未登录提示 -->
<div class="login-gate" id="login-gate" style="display:none">
  <p>请 <a href="/login">登录</a> 后参与讨论，还没账号？<a href="/register">立即注册</a></p>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 基础变量 ──
const topicId = (()=>{
  const m = location.pathname.match(/\/topic\/(\d+)/);
  return m ? parseInt(m[1]) : null;
})();

if (!topicId) {
  document.body.innerHTML = '<div style="color:#e94560;padding:60px;text-align:center;font-size:18px">话题不存在</div>';
}

let me = null, replyTo = null, ctxTarget = null;
let posts = [], postMap = {};

// 头像颜色池
const AVATAR_COLORS = [
  ['#e94560','#7a1a2d'],['#4e8bff','#1a3a7a'],['#50c87a','#1a4a2d'],
  ['#ff8c42','#7a3a1a'],['#a855f7','#4a1a7a'],['#06b6d4','#1a4a5a'],
  ['#f59e0b','#7a4a1a'],['#ec4899','#7a1a4a'],
];
function avatarColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffffffff;
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

// ── 初始化 ──
async function init() {
  if (!topicId) return;
  try {
    const r = await fetch('/api/me', { credentials: 'include' });
    const d = await r.json();
    if (d.ok) {
      me = d;
      document.getElementById('nav-user').style.display = '';
      document.getElementById('nav-user').innerHTML =
        `<a href="/user/${d.id}">${escHtml(d.username)}</a>`;
      document.getElementById('btn-logout').style.display = '';
      document.getElementById('btn-login').style.display = 'none';
      document.getElementById('compose').style.display = '';
      document.getElementById('login-gate').style.display = 'none';
    } else {
      document.getElementById('compose').style.display = 'none';
      document.getElementById('login-gate').style.display = '';
    }
  } catch(e) {
    document.getElementById('compose').style.display = 'none';
    document.getElementById('login-gate').style.display = '';
  }
  loadTopic();
  loadPosts();
}

// ── 话题头部 ──
async function loadTopic() {
  try {
    const res = await fetch(`/api/topics/${topicId}`, { credentials: 'include' });
    if (!res.ok) {
      document.getElementById('topic-header').innerHTML =
        '<div style="color:#e94560">话题不存在或已被删除</div>';
      return;
    }
    const t = await res.json();
    document.title = t.title + ' — 第四次世界大战';
    document.getElementById('topic-header').innerHTML = `
      <h1>${escHtml(t.title)}</h1>
      ${t.description ? `<div class="desc">${escHtml(t.description)}</div>` : ''}
      <div class="meta">
        <span>发起者：<a href="/user/${t.author_id||0}">${escHtml(t.author_name||'系统')}</a></span>
        <span>·</span>
        <span>${formatTime(t.created_at)}</span>
        ${t.pinned ? '<span style="color:#e94560;">📌 置顶</span>' : ''}
      </div>
    `;
  } catch(e) {}
}

// ── 发言列表 ──
async function loadPosts() {
  try {
    const res = await fetch(`/api/topics/${topicId}/posts`, { credentials: 'include' });
    posts = await res.json();
    postMap = {};
    posts.forEach(p => postMap[p.id] = p);
    document.getElementById('skeleton-wrap').style.display = 'none';
    renderPosts();
  } catch(e) {
    document.getElementById('skeleton-wrap').style.display = 'none';
    document.getElementById('posts-wrap').innerHTML =
      '<div class="empty"><p>发言加载失败，请刷新重试</p></div>';
  }
}

function renderPosts() {
  const wrap = document.getElementById('posts-wrap');
  const toolbar = document.getElementById('posts-toolbar');

  document.getElementById('posts-total').textContent = posts.length;
  toolbar.style.display = posts.length ? '' : 'none';

  if (!posts.length) {
    wrap.innerHTML = `<div class="empty"><span class="ei">💬</span><p>还没有人发言，来做第一个！</p></div>`;
    return;
  }

  wrap.innerHTML = posts.map((p, i) => {
    const ref = p.reply_to && postMap[p.reply_to];
    const refHtml = ref
      ? `<div class="reply-ref" onclick="scrollToPost(${ref.id})">
           <span class="ra">${escHtml(ref.author_name)}</span>：${escHtml(ref.content).slice(0,60)}${ref.content.length>60?'…':''}
         </div>`
      : '';
    const canDel = me && (me.id === p.author_id || me.role === 'admin');
    const name = p.author_name || '匿名';
    const [c1, c2] = avatarColor(name);
    const avChar = name[0].toUpperCase();

    return `<div class="post" id="post-${p.id}" data-pid="${p.id}" oncontextmenu="showCtx(event,${p.id})">
      ${refHtml}
      <div class="post-header">
        <div class="avatar" style="background:linear-gradient(135deg,${c1},${c2})">${avChar}</div>
        <div class="post-info">
          <div class="author" style="color:${c1}">
            <a href="/user/${p.author_id}" style="color:${c1}">${escHtml(name)}</a>
          </div>
          <div class="time">${formatTime(p.created_at)}</div>
        </div>
      </div>
      <div class="post-content">${escHtml(p.content)}</div>
      <div class="floor">#${i + 1}</div>
      <div class="post-actions">
        ${me ? `<button class="pa-btn pa-reply" onclick="replyToPost(${p.id})">↩ 回复</button>` : ''}
        ${canDel ? `<button class="pa-btn pa-del" onclick="delPost(event,${p.id})">删除</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ── 跳转 ──
function jumpToFloor(floor) {
  if (!posts.length) return;
  const p = posts[floor - 1];
  if (p) scrollToPost(p.id);
}
function jumpToLast() {
  if (!posts.length) return;
  scrollToPost(posts[posts.length - 1].id);
}
function scrollToPost(id) {
  const el = document.getElementById('post-' + id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('highlight');
  setTimeout(() => el.classList.remove('highlight'), 1000);
}

// ── 右键菜单 ──
function showCtx(e, pid) {
  e.preventDefault();
  ctxTarget = postMap[pid];
  if (!ctxTarget) return;
  const menu = document.getElementById('ctx-menu');
  document.getElementById('ctx-del').style.display =
    (me && (me.id === ctxTarget.author_id || me.role === 'admin')) ? '' : 'none';
  const x = Math.min(e.clientX, window.innerWidth - 165);
  const y = Math.min(e.clientY, window.innerHeight - 110);
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.classList.add('show');
}
document.addEventListener('click', () => document.getElementById('ctx-menu').classList.remove('show'));

function ctxReply() {
  if (!me) { location.href = '/login'; return; }
  if (!ctxTarget) return;
  setReply(ctxTarget);
}
function ctxDelete() {
  if (ctxTarget) delPost(null, ctxTarget.id);
}

// ── 回复 ──
function replyToPost(pid) {
  if (!me) { location.href = '/login'; return; }
  const p = postMap[pid];
  if (!p) return;
  setReply(p);
}
function setReply(p) {
  replyTo = p.id;
  const txt = document.getElementById('ri-text');
  txt.innerHTML = `↩ 回复 <span class="ra">${escHtml(p.author_name)}</span>：${escHtml(p.content).slice(0,50)}${p.content.length>50?'…':''}`;
  document.getElementById('reply-indicator').classList.add('show');
  const ta = document.getElementById('compose-text');
  ta.focus();
  autoResize(ta);
}
function cancelReply() {
  replyTo = null;
  document.getElementById('reply-indicator').classList.remove('show');
}

// ── textarea 自动高度 + 字数计数 ──
function onTextInput(ta) {
  autoResize(ta);
  updateCounter(ta);
}
function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 180) + 'px';
}
function updateCounter(ta) {
  const len = ta.value.length;
  const el = document.getElementById('char-counter');
  el.textContent = len + ' / 2000';
  el.className = 'char-counter' + (len >= 2000 ? ' over' : len >= 1800 ? ' warn' : '');
}

// ── 发送发言 ──
async function sendPost() {
  if (!me) { location.href = '/login'; return; }
  const ta = document.getElementById('compose-text');
  const content = ta.value.trim();
  if (!content) return;
  const btn = document.getElementById('send-btn');
  btn.disabled = true; btn.textContent = '发送中…';
  try {
    const body = { content };
    if (replyTo) body.reply_to = replyTo;
    const res = await fetch(`/api/topics/${topicId}/posts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.ok) {
      ta.value = '';
      ta.style.height = '';
      updateCounter(ta);
      cancelReply();
      const oldLen = posts.length;
      await loadPosts();
      // 滚动到新发言
      if (posts.length > oldLen) {
        const newPost = posts[posts.length - 1];
        setTimeout(() => scrollToPost(newPost.id), 80);
      }
    } else {
      showToast(data.msg || '发送失败', 'err');
    }
  } catch(e) { showToast('网络错误，请重试', 'err'); }
  btn.disabled = false; btn.textContent = '发送';
}

// ── 删除发言 ──
async function delPost(e, pid) {
  if (e) { e.stopPropagation(); e.preventDefault(); }
  if (!confirm('确定删除这条发言？')) return;
  try {
    const res = await fetch(`/api/posts/${pid}`, { method: 'DELETE', credentials: 'include' });
    const data = await res.json();
    if (data.ok) { showToast('发言已删除'); loadPosts(); }
    else showToast(data.msg || '删除失败', 'err');
  } catch(e) { showToast('网络错误', 'err'); }
}

// ── 退出 ──
async function doLogout() {
  await fetch('/api/logout', { method: 'POST', credentials: 'include' });
  location.href = '/';
}

// ── Toast ──
let _toastTimer = null;
function showToast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = (type === 'ok' ? '✓ ' : '✕ ') + msg;
  el.className = 'toast show ' + type;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ── 键盘快捷键 ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('ctx-menu').classList.remove('show');
    cancelReply();
  }
  if (e.ctrlKey && e.key === 'Enter') sendPost();
});

// ── 工具函数 ──
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000), now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
  if (diff < 86400 * 30) return Math.floor(diff / 86400) + '天前';
  return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
}

init();
